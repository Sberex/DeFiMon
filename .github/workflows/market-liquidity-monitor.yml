name: Track market liquidity and utilization alerts
on:
  # Offset checks from the top of the hour; GitHub may still delay cron events.
  schedule:
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  workflow_dispatch:
    inputs:
      source:
        description: Trigger source (external-scheduler identifies an external dispatch, not GitHub cron)
        type: choice
        required: false
        default: manual
        options:
          - manual
          - external-scheduler
      telegram_test:
        description: Send a one-time Telegram connection test
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/market-liquidity-monitor.yml'
      - 'scripts/track-liquidity.ts'
      - 'scripts/track-utilization.ts'
      - 'server/utilization-alert-*.ts'
      - 'server/liquidity-alert-*.ts'
      - 'server/alert-run.ts'
      - 'scripts/deliver-telegram.ts'
      - 'server/telegram-alert*.ts'
permissions:
  contents: write
concurrency:
  group: market-liquidity-alert-tracker
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check enabled markets and save liquidity increases and decreases
        run: npm run track:liquidity -- --publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRACKER_DISPATCH_SOURCE: ${{ github.event.inputs.source || 'manual' }}
          LIQUIDITY_TRACKER_BRANCH: main
          ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_RPC_URL || 'https://eth.drpc.org' }}
          ARBITRUM_RPC_URL: ${{ secrets.ARBITRUM_RPC_URL || 'https://arb1.arbitrum.io/rpc' }}
          PLASMA_RPC_URL: ${{ secrets.PLASMA_RPC_URL || 'https://rpc.plasma.to' }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL || 'https://mainnet.base.org' }}
          BSC_RPC_URL: ${{ secrets.BSC_RPC_URL || 'https://bsc-rpc.publicnode.com' }}
          ARC_RPC_URL: ${{ secrets.ARC_RPC_URL || 'https://rpc.mainnet.arc.io' }}
      - name: Check enabled utilization thresholds and save crossings
        if: ${{ !cancelled() }}
        run: npm run track:utilization -- --publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRACKER_DISPATCH_SOURCE: ${{ github.event.inputs.source || 'manual' }}
          UTILIZATION_TRACKER_BRANCH: main
          ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_RPC_URL || 'https://eth.drpc.org' }}
          ARBITRUM_RPC_URL: ${{ secrets.ARBITRUM_RPC_URL || 'https://arb1.arbitrum.io/rpc' }}
          PLASMA_RPC_URL: ${{ secrets.PLASMA_RPC_URL || 'https://rpc.plasma.to' }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL || 'https://mainnet.base.org' }}
          BSC_RPC_URL: ${{ secrets.BSC_RPC_URL || 'https://bsc-rpc.publicnode.com' }}
          ARC_RPC_URL: ${{ secrets.ARC_RPC_URL || 'https://rpc.mainnet.arc.io' }}
      - name: Deliver new and retryable alerts to Telegram
        if: ${{ !cancelled() }}
        run: npm run deliver:telegram -- --publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_TRACKER_BRANCH: main
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_SEND_TEST: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.telegram_test == 'true' }}

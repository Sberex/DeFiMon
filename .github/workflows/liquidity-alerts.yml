name: Track market liquidity alerts
on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/liquidity-alerts.yml'
      - 'scripts/track-liquidity.ts'
      - 'server/liquidity-alert-*.ts'
permissions:
  contents: write
concurrency:
  group: market-liquidity-alert-tracker
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check enabled markets and save increases
        run: npm run track:liquidity -- --publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LIQUIDITY_TRACKER_BRANCH: main
          ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_RPC_URL || 'https://eth.drpc.org' }}
          ARBITRUM_RPC_URL: ${{ secrets.ARBITRUM_RPC_URL || 'https://arb1.arbitrum.io/rpc' }}
          PLASMA_RPC_URL: ${{ secrets.PLASMA_RPC_URL || 'https://rpc.plasma.to' }}
          BASE_RPC_URL: ${{ secrets.BASE_RPC_URL || 'https://mainnet.base.org' }}
          BSC_RPC_URL: ${{ secrets.BSC_RPC_URL || 'https://bsc-rpc.publicnode.com' }}

# Connect this repository through Render's "New > Blueprint" flow.
# Free services sleep when idle; choose a paid plan in Render for always-on use.
services:
  - type: web
    name: defimon-api
    runtime: node
    plan: free
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.11.1
      - key: FRONTEND_ORIGINS
        value: https://sberex.github.io,https://app.sberex.com
      - key: ETHEREUM_RPC_URL
        sync: false
      - key: PLASMA_RPC_URL
        value: https://rpc.plasma.to
      - key: ARBITRUM_RPC_URL
        value: https://arb1.arbitrum.io/rpc
      - key: BASE_RPC_URL
        value: https://mainnet.base.org
      - key: BSC_RPC_URL
        value: https://bsc-rpc.publicnode.com
      - key: ARC_RPC_URL
        value: https://rpc.mainnet.arc.io
